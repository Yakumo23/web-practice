<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-API</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1 id="title">WEATHER API</h1>

        <form id="search-area">
            <input type="text" id="city-input" placeholder="都市名を入力">
            <button type="submit" id="search-button">検索</button>
        </form>
        
        <p id="city-name"></p>
        <p id="weather"></p>
        <p id="temperature"></p>

        <div id="more-information">
            <p id="humidity"></p>
            <p id="wind-speed"></p>
        </div>

        <p id="error-message"></p>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
